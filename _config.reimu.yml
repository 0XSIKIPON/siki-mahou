# Reimu theme override — lives in the SITE, merged over themes/reimu/_config.yml.
# Only keys we customize go here; everything else falls back to the theme default.
# Full option docs: themes/reimu/README.en.md

# ---------------------------------------------------------------------------
# Navigation menu
# ---------------------------------------------------------------------------
menu:
  - name: home
    url: /
    icon:
  - name: archives
    url: /archives
    icon:
  - name: about
    url: /about
    icon:
  - name: friend
    url: /friend
    icon:

# ---------------------------------------------------------------------------
# Sidebar: position on the LEFT
# ---------------------------------------------------------------------------
sidebar:
  position: left
  menu: true
  article:
    show_common: true

# ---------------------------------------------------------------------------
# Banner: static header image shown on every page.
# File lives at source/images/banner2.jpg
# ---------------------------------------------------------------------------
banner: "/images/banner2.jpg"

# ---------------------------------------------------------------------------
# Identity / avatar
# avatar file lives at source/_data/avatar/avatar.webp
# ---------------------------------------------------------------------------
avatar: "avatar.webp"

# ---------------------------------------------------------------------------
# Favicon (browser tab icon): Black Bulls emblem instead of the theme default
# (/images/favicon.ico). Source art is 468x512; black-bulls-favicon.png is the
# same art transparent-padded to a square 512x512 so tabs don't squash it.
# ---------------------------------------------------------------------------
favicon: "/images/black-bulls-favicon.png"

# ---------------------------------------------------------------------------
# Cursor: disable the theme's custom Reimu cursor images and fall back to the
# native OS cursors (auto / pointer / text).
# ---------------------------------------------------------------------------
reimu_cursor:
  enable: false

# ---------------------------------------------------------------------------
# RSS: off. The theme defaults to rss: atom.xml, but hexo-generator-feed is not
# installed, so that file is never built and both the navbar icon and the head
# <link rel="alternate"> pointed at a 404. false makes the theme skip rendering
# them. To enable RSS later: npm i hexo-generator-feed, then set rss: atom.xml.
# ---------------------------------------------------------------------------
rss: false

# ---------------------------------------------------------------------------
# Social links — uncomment and fill in as needed
# ---------------------------------------------------------------------------
# NOTE: keys listed here do double duty — they render the sidebar icons AND
# they gate which glyphs get compiled into the icon font CSS (see
# themes/reimu/source/css/iconfont.styl: `if ('instagram' in social-keys)`).
# The About page reuses those same glyphs, so a key must live here for its
# icon to appear there.
social:
  github: https://github.com/0XSIKIPON
  twitter: https://x.com/SeifMessaoudi
  linkedin: https://www.linkedin.com/in/seifeddine-messaoudi/

# ---------------------------------------------------------------------------
# Sidebar widgets, rendered top-to-bottom in this order.
# 'archive' is the only shipped widget left out.
# NOTE: with no posts published yet these render as empty boxes; they fill in
# automatically once posts exist.
# ---------------------------------------------------------------------------
widgets:
  - recent_posts
  - category
  - tag
  - tagcloud

# ---------------------------------------------------------------------------
# Dark mode: auto follows the OS preference, with a manual toggle
# ---------------------------------------------------------------------------
dark_mode:
  enable: auto

# ---------------------------------------------------------------------------
# Fonts: match the official demo (d-sketon.github.io) — LXGW WenKai for body
# text, loaded from the ZeoSeven font API. custom_font has higher priority
# than the Google `font` block, so this becomes the primary article family.
# ---------------------------------------------------------------------------
custom_font:
  enable: true
  article:
    - css: https://fontsapi.zeoseven.com/292/main/result.css
      name: LXGW WenKai
  code:

# ---------------------------------------------------------------------------
# Search: local generator search (zero external service, zero config)
# ---------------------------------------------------------------------------
generator_search:
  enable: true
  field: post
  content: true

# ---------------------------------------------------------------------------
# Logo: replace the yin-yang (taichi) with the Kubernetes wheel everywhere.
#
# Image-based instances (back-to-top button, footer, sponsor) are repointed
# here via *.icon.url with mask:true -> rendered as a theme-colored silhouette.
# Path is relative to css/style.css, so "../images/..." reaches source/images.
# The glyph / inline-SVG instances (sidebar menu buttons, header nav, sidebar
# toggle, and the refresh preloader) are converted to the same masked SVG by
# the injector CSS further down.
# ---------------------------------------------------------------------------
top:
  enable: true
  position: right
  icon:
    url: "../images/k8s-wheel.svg"
    rotate: true
    mask: true

footer:
  icon:
    url: "../images/k8s-wheel.svg"
    rotate: true
    mask: true

# ---------------------------------------------------------------------------
# Inject CSS: replace every remaining yin-yang (taichi) with the masked k8s
# wheel. These are font glyphs / inline SVG, so we hide the original and
# overlay a mask-clipped ::after tinted with the theme red.
#   .sidebar-menu-icon  -> sidebar menu buttons + sidebar menu toggle
#   .main-nav-icon      -> top navbar icon
#   .loading-taichi     -> the preloader shown on page refresh
# ---------------------------------------------------------------------------
injector:
  head_end: |
    <style>
    .sidebar-menu-icon,
    .main-nav-icon,
    .loading-taichi {
      color: transparent !important;
      position: relative;
    }
    /* Preloader: hide the original inline SVG and give the box an explicit
       size, because without the SVG the container would collapse to 0x0. */
    .loading-taichi svg,
    .loading-taichi img {
      display: none !important;
    }
    .loading-taichi {
      width: 150px;
      height: 150px;
    }
    .sidebar-menu-icon::after,
    .main-nav-icon::after,
    .loading-taichi::after {
      content: "";
      position: absolute;
      inset: 0;
      background-color: var(--red-1, #ff5252);
      -webkit-mask: url(/siki-mahou/images/k8s-wheel.svg) no-repeat center / contain;
      mask: url(/siki-mahou/images/k8s-wheel.svg) no-repeat center / contain;
    }
    /* When a menu item is active or hovered the button turns solid red, so
       paint the wheel white to keep it visible (mirrors the theme's own
       .link-active color:#fff on the icon). */
    .link-active .sidebar-menu-icon::after,
    .sidebar-menu-link-wrap:hover .sidebar-menu-icon::after,
    .main-nav-icon:hover::after {
      background-color: #fff;
    }
    /* Search overlay: replace the default reimu.png with a custom image. */
    .reimu-bg {
      content: url(/siki-mahou/images/reimu-no-bg.png);
      width: 150px;
      height: auto;
    }
    /* About page "Find me": icon-only social row, separated by "/".
       Names live in title/aria-label so they show on hover and to screen
       readers without taking up visual space. */
    .about-socials {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      margin: 1.2em 0;
    }
    .about-social {
      display: inline-flex;
      align-items: center;
      text-decoration: none !important;
      color: inherit;
      transition: color .2s, transform .2s;
    }
    .about-social:hover {
      color: var(--red-1, #ff5252);
      transform: translateY(-2px);
    }
    .about-social .icon {
      font-size: 1.6em;
      line-height: 1;
    }
    /* Icon-font glyphs for the About page socials. The theme only compiles
       these when the matching key exists in `social:`, and the compiled rules
       land in style.css -- which browsers cache aggressively, so a stale copy
       shows blank boxes. Declaring them here in the injected <style> keeps the
       icons working regardless of which style.css version is cached. */
    .about-social .icon-github::before    { font-family: 'iconfont'; content: '\e619'; }
    .about-social .icon-twitter::before   { font-family: 'iconfont'; content: '\e62a'; }
    .about-social .icon-linkedin::before  { font-family: 'iconfont'; content: '\e614'; }
    .about-social .icon-email::before     { font-family: 'iconfont'; content: '\e63c'; }
    .about-social .icon-instagram::before { font-family: 'iconfont'; content: '\e615'; }
    .about-social .icon-facebook::before  { font-family: 'iconfont'; content: '\e60e'; }
    /* Brand colors. The theme defines these in _partial/sidebar.styl but scopes
       them under the sidebar, so the About page icons fell back to inherited
       text color (the theme red). Restate them here, unscoped.
       Values match the theme's own: sidebar.styl:202-244. */
    .about-social .icon-github    { color: #191717; }
    [data-theme='dark'] .about-social .icon-github { color: #bc88ff; }
    .about-social .icon-twitter   { color: #191717; }
    [data-theme='dark'] .about-social .icon-twitter { color: #e7e7e7; }
    .about-social .icon-linkedin  { color: #0e76a8; }
    .about-social .icon-email     { color: #ea4335; }
    .about-social .icon-instagram { color: #e1306c; }
    .about-social .icon-facebook  { color: #3b5998; }
    /* Hover tints every icon the theme red, so override the brand color. */
    .about-social:hover .icon { color: var(--red-1, #ff5252); }

    /* Standalone pages (About / Friends) render through the same article
       template as posts, so they inherit a published-date line built from the
       file's mtime. Pages aren't dated content -- hide it. Scoped to
       id^="page-" so real post dates are untouched. */
    article[id^="page-"] .article-meta {
      display: none;
    }

    /* Reference cards inside posts -- deliberately mirrors the Friends page
       cards (themes/reimu/source/css/_partial/friend.styl) so the two read as
       one design. Same two-up grid, same card chrome, same hover lift; the
       icon box is smaller and uses `contain` because these are logos with
       whitespace, not avatars that should be cropped to fill. */
    .ref-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 16px 0;
    }
    .ref-item {
      width: calc(50% - 10px);
      box-sizing: border-box;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--color-wrap);
      box-shadow: var(--shadow-card);
      border-radius: 12px;
      text-decoration: none !important;
      color: inherit;
      transition: 0.3s;
    }
    .ref-item:hover {
      transform: scale(1.015);
      box-shadow: var(--shadow-card-hover);
    }
    .ref-icon {
      height: 48px;
      width: 48px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ref-icon img {
      max-width: 100%;
      max-height: 100%;
      /* contain, not cover: logos must not be cropped. */
      object-fit: contain;
    }
    /* Several of these logos are near-black and vanish in dark mode. Lifting
       brightness is enough without washing out the colored ones. */
    [data-theme='dark'] .ref-icon img {
      filter: brightness(0) invert(1);
      opacity: .85;
    }
    .ref-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      gap: 2px;
    }
    .ref-name {
      color: var(--red-2);
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ref-desc {
      color: var(--grey-9);
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    /* One per row on narrow screens, matching friend.styl's mg-normal rule. */
    @media (max-width: 800px) {
      .ref-item { width: 100%; }
    }
    </style>

# ---------------------------------------------------------------------------
# Home page: show CATEGORY cover cards instead of the plain post list.
# cover: empty = random cover from source/_data/covers.yml.
# Replace the cover paths with real images when you have them.
# ---------------------------------------------------------------------------
home_categories:
  enable: true
  content:
    - categories: CTF writeups
      cover: /images/covers/CTFwriteups-banner.jpg
    - categories: Blogs
      cover: /images/covers/Blogs-banner.jpg

# ---------------------------------------------------------------------------
# pjax: kept on for faster in-site navigation (originally added so the music
# player would survive page changes; still worth having without it).
# ---------------------------------------------------------------------------
pjax:
  enable: true

# ---------------------------------------------------------------------------
# Sidebar music player: OFF. Keeping the blog simple and avoiding hosting
# unlicensed commercial soundtracks. Disabling APlayer also drops its CSS/JS
# from every page. To re-enable: set aplayer.enable true and add an audio list
# of direct .mp3 URLs (APlayer cannot play YouTube/Spotify links).
# ---------------------------------------------------------------------------
player:
  disable_on_mobile: false
  position: before_sidebar
  aplayer:
    enable: false
    options:
      fixed: false
      autoplay: false
      loop: all
      order: list
      preload: none
      volume: 0.5
      listFolded: false
  meting:
    enable: false

# ---------------------------------------------------------------------------
# Comments: NONE for now. Every comment system stays disabled (theme default).
# To add giscus later: set comment.default: giscus and fill the giscus block.
# ---------------------------------------------------------------------------
