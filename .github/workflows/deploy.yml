# Build the Hexo site and publish it to GitHub Pages.
#
# WHY THE PAGES SOURCE IS "GitHub Actions" AND NOT "Deploy from a branch":
# the theme is a PRIVATE submodule (themes/reimu -> 0XSIKIPON/Siki-Mahou-theme),
# and Pages' own builder only fetches submodules that are public. Building here
# lets us authenticate that fetch with a deploy key and hand Pages the finished
# public/ directory.
#
# ============================== REQUIRES ================================
# Repository secret (Settings -> Secrets and variables -> Actions):
#   THEME_DEPLOY_KEY   PRIVATE half of an SSH keypair whose PUBLIC half is a
#                      read-only Deploy key on the Siki-Mahou-theme repo.
#
# Repository setting:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# The site is a PROJECT site, so it is served under /siki-mahou/. That prefix
# lives in _config.yml (`root`) and, for paths that never pass through
# url_for(), literally in the source -- see the note in _config.yml.
# ========================================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. cancel-in-progress is deliberately false: cancelling a
# half-finished Pages deployment can leave the site in a broken state, so queue
# instead of interrupting.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write # publish to Pages
  id-token: write # OIDC token deploy-pages exchanges for the upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site repo is public but the theme submodule is private, so the two
      # fetches need different credentials:
      #   - this repo    -> the automatic GITHUB_TOKEN (checkout's default)
      #   - themes/reimu -> THEME_DEPLOY_KEY
      # They cannot be combined: checkout's `ssh-key` input rewrites auth for
      # EVERY fetch it performs, including this repo's own -- and the deploy key
      # has no access here, which fails with a misleading "Repository not
      # found". Hence: check out the site first, then the submodule separately
      # under an ssh-agent holding the deploy key.
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          # Submodule handled in the next step, with its own credential.
          submodules: false
          # Full history: Hexo reads git metadata for post dates when a post
          # has no explicit `date:` in its front-matter.
          fetch-depth: 0

      - name: Load theme deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.THEME_DEPLOY_KEY }}

      - name: Check out private theme submodule
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          # A missing theme yields a site with no layouts rather than a hard
          # failure, so assert it landed before spending time on the build.
          test -f themes/reimu/_config.yml || {
            echo "::error::themes/reimu did not check out - deploy key or submodule URL is wrong"
            exit 1
          }
          echo "Theme checked out at $(git -C themes/reimu rev-parse --short HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo clean && npx hexo generate

      - name: Verify build output
        # Fail loudly here rather than publishing an empty or half-built site.
        run: |
          set -euo pipefail
          test -f public/index.html || {
            echo "::error::public/index.html missing - build produced no home page"; exit 1;
          }
          # Every asset path must carry the project-site prefix. A bare "/images/"
          # means something bypassed url_for() and would 404 once deployed.
          if grep -rlq 'src="/images/' public/ 2>/dev/null; then
            echo "::error::found unprefixed /images/ paths - they will 404 under /siki-mahou/"
            grep -rl 'src="/images/' public/ | head
            exit 1
          fi
          echo "Built $(find public -type f | wc -l) files."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Deploy is a separate job so the build cannot hold the Pages environment
  # open while it runs, and so a build failure never reaches deployment.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
