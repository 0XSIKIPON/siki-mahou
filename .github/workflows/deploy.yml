# Build the Hexo site and publish it to Cloudflare Pages.
#
# WHY NOT CLOUDFLARE'S GIT INTEGRATION:
# The theme lives in a PRIVATE submodule (themes/reimu ->
# 0XSIKIPON/Siki-Mahou-theme). Cloudflare's own builders have no clean way to
# authenticate an SSH submodule, so we build here in Actions -- where a deploy
# key works -- and push the finished public/ directory to Cloudflare with
# Wrangler's direct-upload mode. Do NOT connect the Cloudflare Git integration.
#
# ============================== REQUIRES ================================
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Custom token with Account -> Cloudflare Pages ->
#                          Edit, plus Account -> Workers Scripts -> Edit.
#                          (The old "Cloudflare Pages: Edit" template is gone.)
#   CLOUDFLARE_ACCOUNT_ID  Workers & Pages -> Account Details sidebar.
#   THEME_DEPLOY_KEY       PRIVATE half of an SSH keypair whose PUBLIC half is
#                          a read-only Deploy key on the Siki-Mahou-theme repo.
#
# Attaching a custom domain later: add it in the Cloudflare Pages project, then
# change `url:` in _config.yml. `root:` stays "/" either way.
# ========================================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deploy at a time; cancel superseded runs.
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

env:
  # Cloudflare Pages project, created as a Direct Upload project.
  # Serves at https://siki-mahou.pages.dev
  CLOUDFLARE_PROJECT_NAME: siki-mahou

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # The site repo and the theme submodule live in two different private
      # repos, so they need two different credentials:
      #   - this repo        -> the automatic GITHUB_TOKEN (checkout's default)
      #   - themes/reimu     -> THEME_DEPLOY_KEY, a deploy key registered on
      #                         0XSIKIPON/Siki-Mahou-theme
      # They cannot be combined: checkout's `ssh-key` input rewrites the auth
      # for EVERY fetch it performs, including this repo's own -- and the deploy
      # key has no access here, so the main fetch fails with a misleading
      # "Repository not found". Hence: check out the site first, then bring the
      # submodule in separately under an ssh-agent holding the deploy key.
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          # Submodule handled in the next step, with its own credential.
          submodules: false
          # Full history: Hexo reads git metadata for post dates when a post
          # has no explicit `date:` in its front-matter.
          fetch-depth: 0

      - name: Load theme deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.THEME_DEPLOY_KEY }}

      - name: Check out private theme submodule
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          # A missing theme yields a site with no layouts rather than a hard
          # failure, so assert it landed before spending time on the build.
          test -f themes/reimu/_config.yml || {
            echo "::error::themes/reimu did not check out - deploy key or submodule URL is wrong"
            exit 1
          }
          echo "Theme checked out at $(git -C themes/reimu rev-parse --short HEAD)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npx hexo clean && npx hexo generate

      - name: Verify build output
        # Fail loudly here rather than silently deploying an empty site.
        run: |
          test -f public/index.html || { echo "::error::public/index.html missing - build produced no home page"; exit 1; }
          echo "Built $(find public -type f | wc -l) files."

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
